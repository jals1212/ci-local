# Stages a release on npm when a tag is pushed, through npm's trusted
# publishing (OIDC): no npm token is stored anywhere, and the package carries a
# provenance statement that links it to this workflow run.
#
# Two packages live in this repository, released by tag prefix:
#   vX.Y.Z     @jals1212/ci-local (the CLI), at the root
#   pi-vX.Y.Z  @jals1212/ci-local-pi (the Pi package), in pi/
# Each has its own version, CHANGELOG.md and GitHub release.
#
# Staged, not published: the version waits on the registry, invisible, until a
# maintainer approves it with 2FA (`npm stage list`, then
# `npm stage approve <id>`, or on npmjs.com). A pushed tag alone publishes
# nothing.
#
# Once staged, the release job creates the GitHub release of the tag, its
# notes the version's section of that package's CHANGELOG.md (an existing
# release is left alone). The Pi package's release is never marked latest: the
# repository's latest release stays the CLI's.
#
# One-time setup on npmjs.com, for each package: Settings -> Trusted publisher
# -> GitHub Actions, repository jals1212/ci-local, workflow release.yml, with
# "Allow npm publish" and "Allow npm dist-tag" left unchecked. The first
# publish of @jals1212/ci-local-pi is made by hand (`npm publish --access
# public` in pi/, with 2FA): a package must exist before it can name a
# trusted publisher.
name: Release

on:
  push:
    tags: ['v*.*.*', 'pi-v*.*.*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      dir: ${{ steps.which.outputs.dir }}
      version: ${{ steps.which.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `npm stage` needs npm 11.19 or later (Node 24.21 ships it); checked below.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Which package the tag releases, and that the tag is its version
        id: which
        run: |
          case "$GITHUB_REF_NAME" in
            pi-v*) dir=pi; version="${GITHUB_REF_NAME#pi-v}" ;;
            *) dir=.; version="${GITHUB_REF_NAME#v}" ;;
          esac
          declared="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).version' "$dir/package.json")"
          [ "$version" = "$declared" ] || { echo "::error::Tag $GITHUB_REF_NAME, $dir/package.json $declared"; exit 1; }
          if [ "$dir" = . ]; then
            grep -q "^CI_LOCAL_VERSION=\"$version\"$" bin/ci-local || { echo "::error::bin/ci-local is not at $version"; exit 1; }
          fi
          grep -q "^## $version$" "$dir/CHANGELOG.md" || { echo "::error::$dir/CHANGELOG.md has no ## $version section"; exit 1; }
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: The CLI the Pi package depends on is on npm
        if: steps.which.outputs.dir == 'pi'
        run: |
          range="$(node -p 'require("./pi/package.json").dependencies["@jals1212/ci-local"]')"
          [ -n "$(npm view "@jals1212/ci-local@$range" version)" ] || { echo "::error::No @jals1212/ci-local $range on npm yet: release the CLI first"; exit 1; }
      # One install and one run of the checks for both packages: the Pi tests
      # import the CLI from this checkout (scripts/link-self.mjs).
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Stage the release (approve it on npm with 2FA)
        working-directory: ${{ steps.which.outputs.dir }}
        env:
          VERSION: ${{ steps.which.outputs.version }}
        run: |
          # A version already on npm (the first ci-local-pi, published by hand
          # before its trusted publisher could exist) is left alone: the tag
          # then only makes its GitHub release.
          name="$(node -p 'require("./package.json").name')"
          if [ -n "$(npm view "$name@$VERSION" version 2>/dev/null)" ]; then
            echo "::notice::$name $VERSION is already on npm: not staged again"
            exit 0
          fi
          npm stage --help >/dev/null 2>&1 || { echo "::error::npm $(npm -v) has no npm stage"; exit 1; }
          npm stage publish --provenance --access public

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The GitHub release, with the version's CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
          DIR: ${{ needs.publish.outputs.dir }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "The release $GITHUB_REF_NAME exists: left alone."
            exit 0
          fi
          awk -v v="$VERSION" '$0=="## "v{on=1;next} on&&/^## /{exit} on' "$DIR/CHANGELOG.md" | sed -e '/./,$!d' > notes.md
          [ -s notes.md ] || { echo "::error::$DIR/CHANGELOG.md has no notes for $VERSION"; exit 1; }
          if [ "$DIR" = pi ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "ci-local-pi $VERSION" --notes-file notes.md --latest=false
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$VERSION" --notes-file notes.md
          fi
